name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-penpot
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Nothing to push from the eval-only check; PRs pull read-only.
          skipPush: true
      - run: nix flake check --no-build --print-build-logs
      - run: nix fmt -- --check $(git ls-files '*.nix')

  build:
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - penpot-backend
          - penpot-frontend
          - penpot-exporter
          - penpot-mcp
          - penpot-render-wasm
          - penpot-render-wasm-export
        # .#<pkg> resolves to the runner's own system, so the same command
        # covers x86_64-linux and aarch64-linux.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-penpot
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Push merged builds to the cache; PRs only pull from it.
          skipPush: ${{ github.event_name == 'pull_request' }}
      - run: nix build --print-build-logs .#${{ matrix.pkg }}

  vm-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-penpot
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --print-build-logs .#checks.x86_64-linux.penpot-vm-test
